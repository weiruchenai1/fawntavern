name: Beta release

on:
  push:
    tags: ['v*-beta*']

permissions:
  actions: read
  contents: write

jobs:
  build-beta:
    name: Signed beta artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit passed Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          SUCCESS_COUNT="$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1" \
            --jq '.total_count')"
          if [[ "$SUCCESS_COUNT" -eq 0 ]]; then
            echo "::error::Android CI has not passed for $GITHUB_SHA."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive Android version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(bash scripts/android-version-code.sh "$VERSION_NAME")"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Verify beta configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON"

      - name: Prepare signing key
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci-release.keystore
          cat > keystore.properties <<EOF
          storeFile=.ci-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Verify signing key
        run: |
          keytool -list \
            -keystore .ci-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
          keytool -certreq \
            -keystore .ci-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -file /dev/null

      - name: Prepare Firebase configuration
        run: |
          umask 077
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/release/google-services.json

      - name: Build signed beta APK and App Bundle
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Generate checksums
        run: |
          cd app/build/outputs
          find apk/release bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload beta build records
        uses: actions/upload-artifact@v7
        with:
          name: fawntavern-${{ github.ref_name }}-build-records
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/SHA256SUMS.txt \
            --prerelease \
            --generate-notes \
            --title "FawnTavern $GITHUB_REF_NAME"

      - name: Remove signing material
        if: always()
        run: rm -f .ci-release.keystore keystore.properties app/src/release/google-services.json
