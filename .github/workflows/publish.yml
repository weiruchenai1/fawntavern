name: Publish

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit passed Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          # 纯文档提交会跳过 Android CI。发布时允许复用最近一次成功的祖先提交，
          # 但从该提交到标签之间只能包含与 android.yml 的 paths-ignore 一致的文档文件。
          VERIFIED_CI_SHA=""
          while IFS= read -r CANDIDATE_SHA; do
            if ! git merge-base --is-ancestor "$CANDIDATE_SHA" "$GITHUB_SHA"; then
              continue
            fi

            ONLY_IGNORED_CHANGES=true
            while IFS= read -r CHANGED_PATH; do
              case "$CHANGED_PATH" in
                *.md|docs/*) ;;
                *)
                  ONLY_IGNORED_CHANGES=false
                  break
                  ;;
              esac
            done < <(git diff --name-only "$CANDIDATE_SHA" "$GITHUB_SHA")

            if [[ "$ONLY_IGNORED_CHANGES" == "true" ]]; then
              VERIFIED_CI_SHA="$CANDIDATE_SHA"
              break
            fi
          done < <(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?event=push&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha')

          if [[ -z "$VERIFIED_CI_SHA" ]]; then
            echo "::error::No successful Android CI run covers the code in $GITHUB_SHA."
            exit 1
          fi
          echo "Using Android CI result from $VERIFIED_CI_SHA."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 发布任务只读取已有缓存，避免为每个标签创建新缓存。
          cache-read-only: true

      - name: Derive Android version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(bash scripts/android-version-code.sh "$VERSION_NAME")"
          if [[ "$VERSION_NAME" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Verify publish configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON"
          test -n "$BUGLY_APP_ID"

      - name: Prepare signing key
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci-release.keystore
          cat > keystore.properties <<EOF
          storeFile=.ci-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Verify signing key
        run: |
          keytool -list \
            -keystore .ci-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
          keytool -certreq \
            -keystore .ci-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -file /dev/null

      - name: Prepare Firebase configuration
        run: |
          umask 077
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/release/google-services.json

      - name: Build signed APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

          ARM64_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' -print -quit)"
          X86_64_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*x86_64*.apk' -print -quit)"
          test -n "$ARM64_SOURCE"
          test -n "$X86_64_SOURCE"

          ARM64_APK="app/build/outputs/apk/release/FawnTavern-${VERSION_NAME}-arm64-v8a.apk"
          X86_64_APK="app/build/outputs/apk/release/FawnTavern-${VERSION_NAME}-x86_64.apk"
          mv "$ARM64_SOURCE" "$ARM64_APK"
          mv "$X86_64_SOURCE" "$X86_64_APK"
          echo "ARM64_APK=$ARM64_APK" >> "$GITHUB_ENV"
          echo "X86_64_APK=$X86_64_APK" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          sha256sum "$ARM64_APK" "$X86_64_APK" > app/build/outputs/SHA256SUMS.txt

      - name: Upload build records
        uses: actions/upload-artifact@v7
        with:
          name: fawntavern-${{ github.ref_name }}-build-records
          path: |
            ${{ env.ARM64_APK }}
            ${{ env.X86_64_APK }}
            app/build/outputs/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: ${{ contains(github.ref_name, '-') && 30 || 90 }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ARGS=(
            "$GITHUB_REF_NAME"
            "$ARM64_APK"
            "$X86_64_APK"
            app/build/outputs/SHA256SUMS.txt
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"

      - name: Remove signing material
        if: always()
        run: rm -f .ci-release.keystore keystore.properties app/src/release/google-services.json
