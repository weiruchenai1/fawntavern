name: Release build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-release:
    name: Signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$VERSION_CODE"

      - name: Prepare signing key
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci-release.keystore
          cat > keystore.properties <<EOF
          storeFile=.ci-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed APK and App Bundle
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon clean assembleRelease bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fawntavern-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material
        if: always()
        run: rm -f .ci-release.keystore keystore.properties
