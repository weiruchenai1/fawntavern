name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 仅允许 main 分支的推送写入新缓存；拉取请求和手动运行只读取已有缓存。
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify Android version calculation
        run: bash scripts/android-version-code.sh --self-test

      - name: Check module architecture
        run: ./gradlew --no-daemon --no-configuration-cache checkArchitecture

      - name: Run JVM and Compose regression tests, lint, and Debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug :app:assembleDebug

      - name: Verify committed Room schemas
        run: git diff --exit-code -- data/chat/schemas

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fawntavern-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
