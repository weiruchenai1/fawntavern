name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 仅允许 main 分支的推送写入新缓存；拉取请求和手动运行只读取已有缓存。
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify Android version calculation
        run: bash scripts/android-version-code.sh --self-test

      - name: Prepare Firebase configuration
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          umask 077
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/release/google-services.json

      - name: Run unit tests, lint, and builds
        run: |
          TASKS=(testDebugUnitTest lintDebug assembleDebug)
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            TASKS+=(assembleRelease)
          fi
          ./gradlew --no-daemon "${TASKS[@]}"

      - name: Verify committed Room schemas
        run: git diff --exit-code -- app/schemas

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fawntavern-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Firebase configuration
        if: always()
        run: rm -f app/src/release/google-services.json

  ui-tests:
    name: Instrumented UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 模拟器任务只读取已有缓存，避免为该任务持续创建独立缓存。
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
